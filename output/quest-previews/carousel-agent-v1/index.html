<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карусельщик — результат учебного комплекта</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #f3f1ed; color: #26231e; font: 20px/1.45 Arial, sans-serif; }
  header { margin-bottom: 24px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  p { margin: 0; color: #655f55; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 0 0; font-size: 18px; }
</style>
<header>
  <h1>Карусельщик · первый учебный результат</h1>
  <p>Четыре PNG, созданные учебным комплектом. Изображения показаны целиком.</p>
</header>
<main>
  <figure><img src="slide-01.png" alt="Обложка карусели"><figcaption>01 · Обложка</figcaption></figure>
  <figure><img src="slide-02.png" alt="Второй слайд карусели"><figcaption>02 · Первый шаг</figcaption></figure>
  <figure><img src="slide-03.png" alt="Третий слайд карусели"><figcaption>03 · Продолжение</figcaption></figure>
  <figure><img src="slide-04.png" alt="Финальный слайд карусели"><figcaption>04 · Призыв к действию</figcaption></figure>
</main>
</html>
