location = /kurs1 { return 301 /kurs1/; }

# Cropped public installation screenshots only; never publish the originals.
location = /kurs1/home-screen-guide/iphone-share.jpg {
    alias /var/www/ezhgenti.ru/kurs1-current/home-screen-guide/iphone-share.jpg;
    default_type image/jpeg;
}
location = /kurs1/home-screen-guide/iphone-more.jpg {
    alias /var/www/ezhgenti.ru/kurs1-current/home-screen-guide/iphone-more.jpg;
    default_type image/jpeg;
}
location = /kurs1/home-screen-guide/iphone-home.jpg {
    alias /var/www/ezhgenti.ru/kurs1-current/home-screen-guide/iphone-home.jpg;
    default_type image/jpeg;
}
location = /kurs1/home-screen-guide/iphone-add.jpg {
    alias /var/www/ezhgenti.ru/kurs1-current/home-screen-guide/iphone-add.jpg;
    default_type image/jpeg;
}

# Only installation metadata and the three branded icons are public.
# Mobile OS icon fetches may not carry the browser's login cookie.
location = /kurs1/manifest.webmanifest {
    alias /var/www/ezhgenti.ru/kurs1-current/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=300";
}
location = /kurs1/app-icons/iskra-180.png {
    alias /var/www/ezhgenti.ru/kurs1-current/app-icons/iskra-180.png;
    default_type image/png;
    add_header Cache-Control "public, max-age=3600";
}
location = /kurs1/app-icons/iskra-192.png {
    alias /var/www/ezhgenti.ru/kurs1-current/app-icons/iskra-192.png;
    default_type image/png;
    add_header Cache-Control "public, max-age=3600";
}
location = /kurs1/app-icons/iskra-512.png {
    alias /var/www/ezhgenti.ru/kurs1-current/app-icons/iskra-512.png;
    default_type image/png;
    add_header Cache-Control "public, max-age=3600";
}

# Открытые страницы выпускниц: портфолио и проверка сертификата.
# Вход сюда не требуется, но это единственные открытые адреса сервиса.
location ^~ /p/ {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}

location ^~ /s/ {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}

# Витрина работ: список тех портфолио, которые ученицы сами открыли для показа.
location = /raboty {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}

location @neiroprofi_login {
    return 302 /kurs1/login;
}

# The check endpoint cannot be reached by an external visitor.
location = /_neiroprofi_auth {
    internal;
    proxy_pass http://127.0.0.1:8799/internal/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /kurs1/login {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
}

location = /kurs1/admin {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

location = /kurs1/account {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}

location = /kurs1/access/api/iskra {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
}

location ^~ /kurs1/access/ {
    # Портфолио — самая длинная форма сервиса: карточки работ с описаниями.
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
}

# Gate ALL course content, not just the entry HTML. Fail closed when the service is unavailable.
location ^~ /kurs1/ {
    auth_request /_neiroprofi_auth;
    error_page 401 = @neiroprofi_login;
    alias /var/www/ezhgenti.ru/kurs1-current/;
    index index.html;
    add_header Cache-Control "no-store, private" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
