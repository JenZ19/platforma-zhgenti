<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Место для реального скриншота выбора папки</title>
  <desc id="desc">Заглушка для будущего снимка выбора рабочей папки codex-test.</desc>
  <rect width="1280" height="720" fill="#eef2ec"/>
  <rect x="92" y="82" width="1096" height="556" rx="36" fill="#fcfdfb" stroke="#aebba8" stroke-width="3" stroke-dasharray="14 12"/>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#60755f">МЕСТО ДЛЯ РЕАЛЬНОГО СКРИНШОТА</text>
  <text x="150" y="342" font-family="Georgia, serif" font-size="64" fill="#283228">Папка первого проекта</text>
  <text x="150" y="418" font-family="Arial, sans-serif" font-size="32" fill="#5b685a">«Открыть папку» → codex-test → «Открыть»</text>
  <text x="150" y="540" font-family="Arial, sans-serif" font-size="21" fill="#849083">Заменить настоящим экраном без личных папок и документов</text>
</svg>
