<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Место для реального скриншота выбора Codex</title>
  <desc id="desc">Заглушка для будущего снимка верхнего левого меню приложения ChatGPT.</desc>
  <rect width="1280" height="720" fill="#f3eee8"/>
  <rect x="92" y="82" width="1096" height="556" rx="36" fill="#fffdfa" stroke="#c9bcae" stroke-width="3" stroke-dasharray="14 12"/>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#a06b5f">МЕСТО ДЛЯ РЕАЛЬНОГО СКРИНШОТА</text>
  <text x="150" y="342" font-family="Georgia, serif" font-size="64" fill="#2c2824">Выбор Codex</text>
  <text x="150" y="418" font-family="Arial, sans-serif" font-size="32" fill="#645c55">Верхнее левое меню → Codex → «Новая задача»</text>
