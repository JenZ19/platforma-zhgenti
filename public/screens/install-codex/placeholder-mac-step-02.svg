<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Место для реального скриншота установки на Mac</title>
  <desc id="desc">Заглушка для будущего снимка окна установки ChatGPT на Mac.</desc>
  <rect width="1280" height="720" fill="#f5efe8"/>
  <rect x="92" y="82" width="1096" height="556" rx="36" fill="#fffdfa" stroke="#cdbfb4" stroke-width="3" stroke-dasharray="14 12"/>
  <circle cx="170" cy="162" r="38" fill="#4c4641"/>
  <text x="170" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#fff">⌘</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#9a6c61">МЕСТО ДЛЯ РЕАЛЬНОГО СКРИНШОТА</text>
