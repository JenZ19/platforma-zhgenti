<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Место для реального скриншота установки на Windows</title>
  <desc id="desc">Заглушка для будущего снимка окна установки ChatGPT на Windows.</desc>
  <rect width="1280" height="720" fill="#edf4f7"/>
  <rect x="92" y="82" width="1096" height="556" rx="36" fill="#fbfeff" stroke="#9eb8c5" stroke-width="3" stroke-dasharray="14 12"/>
  <circle cx="170" cy="162" r="38" fill="#39789a"/>
  <text x="170" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#fff">⊞</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#39789a">МЕСТО ДЛЯ РЕАЛЬНОГО СКРИНШОТА</text>
  <text x="150" y="362" font-family="Georgia, serif" font-size="58" fill="#24343d">Установка ChatGPT на Windows</text>
  <text x="150" y="426" font-family="Arial, sans-serif" font-size="30" fill="#526d7a">Файл .exe → «Пуск» → «Войти»</text>
  <text x="150" y="548" font-family="Arial, sans-serif" font-size="21" fill="#7d929c">Заменить настоящим экраном без имени, почты и уведомлений</text>
</svg>
