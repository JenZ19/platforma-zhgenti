location = /kurs1 {
    return 301 /kurs1/;
}

location ^~ /kurs1/ {
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name feya-quest-academy.submarine-edu.chatgpt.site;
    proxy_set_header Host feya-quest-academy.submarine-edu.chatgpt.site;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /kurs1;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_pass https://feya-quest-academy.submarine-edu.chatgpt.site/;
    proxy_redirect off;

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json application/manifest+json;
    sub_filter '"/_next/' '"/kurs1/_next/';
    sub_filter '"/covers/' '"/kurs1/covers/';
    sub_filter '"/materials/' '"/kurs1/materials/';
    sub_filter '"/screens/' '"/kurs1/screens/';
    sub_filter '"/screens-mobile/' '"/kurs1/screens-mobile/';
    sub_filter '"/guides/' '"/kurs1/guides/';
    sub_filter '"/og-' '"/kurs1/og-';
    sub_filter '"/favicon-' '"/kurs1/favicon-';

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
